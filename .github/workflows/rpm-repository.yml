name: Publish desktop updates

on:
  release:
    types: [published, edited]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rpm-repository-pages
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || (!github.event.release.draft && !github.event.release.prerelease)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: Install repository tools
        run: sudo apt-get update && sudo apt-get install -y rpm createrepo-c gnupg openssl
      - name: Import dedicated signing key
        env:
          SIGNING_KEY: ${{ secrets.CEDARLOGIC_RPM_SIGNING_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SIGNING_KEY" || { echo 'Missing CEDARLOGIC_RPM_SIGNING_KEY secret'; exit 1; }
          export GNUPGHOME="$RUNNER_TEMP/cedarlogic-gnupg"
          mkdir -m 700 "$GNUPGHOME"
          printf '%s' "$SIGNING_KEY" | gpg --batch --import
          echo "GNUPGHOME=$GNUPGHOME" >> "$GITHUB_ENV"
      - name: Sign latest stable release and build repository
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/build-rpm-repository.py --repository "$GITHUB_REPOSITORY" --output _site
      - name: Remove imported private key
        if: always()
        shell: bash
        run: |
          gpgconf --homedir "$RUNNER_TEMP/cedarlogic-gnupg" --kill all || true
          rm -rf -- "$RUNNER_TEMP/cedarlogic-gnupg"
      - name: Sign Windows installer and build startup update feed
        env:
          GH_TOKEN: ${{ github.token }}
          CEDARLOGIC_WINDOWS_SIGNING_KEY: ${{ secrets.CEDARLOGIC_WINDOWS_SIGNING_KEY }}
        run: python3 scripts/build-windows-appcast.py --repository "$GITHUB_REPOSITORY" --output _site
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy signed RPM repository
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
